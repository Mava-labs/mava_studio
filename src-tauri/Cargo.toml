[package]
name = "mava-studio"
version = "0.1.0"
edition = "2021"

[lib]
name = "mava_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
prost-build = "0.13"
tauri-build  = { version = "2", features = ["codegen"] }

[dependencies]
# Tauri
tauri = { version = "2", features = [] }
tauri-plugin-store    = "2"
tauri-plugin-opener   = "2"
tauri-plugin-dialog   = "2"
tauri-plugin-fs       = "2"

# Async runtime
tokio = { version = "1", features = ["full"] }

# SQLite (async, with runtime-checked queries since we can't use compile-time
# checked queries without a live DB at build time in Tauri)
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "macros", "chrono", "uuid"] }

# Serialisation
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"

# Protobuf
prost = "0.13"

# Utilities
uuid     = { version = "1", features = ["v4", "serde"] }
chrono   = { version = "0.4", features = ["serde"] }
thiserror = "1"
anyhow    = "1"
tokio-util = "0.7"
base64 = "0.22"
sha2 = "0.11.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]


[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(mobile)'] }
